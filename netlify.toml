[build]
  command = "node scripts/prepare-corporate-trust.js && node scripts/apply-search-entity-remediation.cjs && node scripts/validate-ai-procurement-pillar.cjs && node scripts/apply-corporate-economic-growth-mission.cjs && node scripts/validate-corporate-economic-growth-mission.cjs && node scripts/apply-service-taxonomy.cjs && node scripts/validate-service-taxonomy.cjs"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/opportunity/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, private"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/linkedin-publisher/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, private"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/jeffery-mitchell.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment; filename=jeffery-mitchell.vcf"

[[redirects]]
  from = "/opportunity"
  to = "/opportunity/index.html"
  status = 200

# Permanent trust namespace. Keep temporary during pilot so a dedicated
# verification experience can replace this redirect without changing the URL.
[[redirects]]
  from = "/verify"
  to = "/"
  status = 302
  force = true

# Retain the historical homepage artifact in source control, but prevent it
# from remaining an independently authoritative public corporate identity.
[[redirects]]
  from = "/index-imagefirst.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index-imagefirst"
  to = "/"
  status = 301
  force = true

# Consolidate physical HTML files into one extensionless canonical URL per page.
[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/capabilities.html"
  to = "/capabilities"
  status = 301
  force = true

[[redirects]]
