name: One-time Analyze Fit Source Repair

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  repair-source-of-truth:
    if: github.event.comment.body == '/repair-analyze-fit-price-source' && github.event.repository.full_name == 'Aproposchpt2/Apropos-Group-LLC'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair committed homepage price and harden build validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_price = 'Additional report · $15 one-time'
          new_price = 'Additional report · $79.00 one-time'

          if index.count(old_price) != 1:
              raise SystemExit(f'FAIL: expected exactly one stale $15 source price, found {index.count(old_price)}')
          index = index.replace(old_price, new_price)
          if old_price in index or index.count(new_price) != 1:
              raise SystemExit('FAIL: homepage source price repair did not converge to one $79.00 value')
          index_path.write_text(index, encoding='utf-8')

          script_path = Path('scripts/apply-search-entity-remediation.cjs')
          script = script_path.read_text(encoding='utf-8')

          old_normalizer = """// One authoritative Analyze Fit price across the APROPOS ecosystem.\n// Normalize all known legacy/current shorthand variants to the exact public price.\nhtml = html\n  .replaceAll('Additional report · $15 one-time', 'Additional report · $79.00 one-time')\n  .replaceAll('Additional report · $49.99 one-time', 'Additional report · $79.00 one-time')\n  .replaceAll('Additional report · $79 one-time', 'Additional report · $79.00 one-time');\n"""
          new_guard = """// Pricing is source-controlled. The build MUST NOT silently repair stale values,\n// because doing so can hide a bad committed source and allow old pricing to\n// reappear through alternate deploy paths or later merges.\nconst AUTHORITATIVE_ANALYZE_FIT_PRICE = 'Additional report · $79.00 one-time';\nconst pricePattern = /Additional report · \\$([0-9]+(?:\\.[0-9]{1,2})?) one-time/g;\nconst priceMatches = [...html.matchAll(pricePattern)];\nif (priceMatches.length !== 1 || priceMatches[0][0] !== AUTHORITATIVE_ANALYZE_FIT_PRICE) {\n  throw new Error(`Corporate pricing validation failed: expected exactly one \"${AUTHORITATIVE_ANALYZE_FIT_PRICE}\" in committed index.html.`);\n}\n"""
          if old_normalizer not in script:
              raise SystemExit('FAIL: silent Analyze Fit price normalizer block not found')
          script = script.replace(old_normalizer, new_guard)
          script = script.replace("  'Additional report · $79.00 one-time',", "  AUTHORITATIVE_ANALYZE_FIT_PRICE,")

          old_mid = """if (html.includes('Additional report · $15 one-time')) throw new Error('Corporate entity remediation validation failed: stale $15 Analyze Fit price remains.');\nif (html.includes('Additional report · $49.99 one-time')) throw new Error('Corporate entity remediation validation failed: stale $49.99 Analyze Fit price remains.');\nif (html.includes('Additional report · $79 one-time')) throw new Error('Corporate entity remediation validation failed: unnormalized Analyze Fit price remains.');\n"""
          new_mid = """const postTransformPriceMatches = [...html.matchAll(pricePattern)];\nif (postTransformPriceMatches.length !== 1 || postTransformPriceMatches[0][0] !== AUTHORITATIVE_ANALYZE_FIT_PRICE) {\n  throw new Error('Corporate entity remediation validation failed: Analyze Fit price drift detected.');\n}\n"""
          if old_mid not in script:
              raise SystemExit('FAIL: legacy mid-build price checks not found')
          script = script.replace(old_mid, new_mid)

          old_post = """if (!publishedHtml.includes('Additional report · $79.00 one-time')) throw new Error('Corporate post-write validation failed: authoritative Analyze Fit price missing from publish artifact.');\nif (publishedHtml.includes('Additional report · $15 one-time')) throw new Error('Corporate post-write validation failed: stale $15 Analyze Fit price remains in publish artifact.');\nif (publishedHtml.includes('Additional report · $49.99 one-time')) throw new Error('Corporate post-write validation failed: stale $49.99 Analyze Fit price remains in publish artifact.');\n"""
          new_post = """const publishedPriceMatches = [...publishedHtml.matchAll(pricePattern)];\nif (publishedPriceMatches.length !== 1 || publishedPriceMatches[0][0] !== AUTHORITATIVE_ANALYZE_FIT_PRICE) {\n  throw new Error('Corporate post-write validation failed: authoritative Analyze Fit price drifted in publish artifact.');\n}\n"""
          if old_post not in script:
              raise SystemExit('FAIL: legacy post-write price checks not found')
          script = script.replace(old_post, new_post)
          script = script.replace(
              "console.log('[corporate-search-entity] PASS — publish artifact has entity graph, Analyze Fit $79.00 pricing, and exactly-once hero preload.');",
              "console.log('[corporate-search-entity] PASS — committed source and publish artifact both enforce Analyze Fit $79.00 pricing with exactly-once hero preload.');"
          )
          if ".replaceAll('Additional report · $15 one-time'" in script:
              raise SystemExit('FAIL: silent $15 normalizer still exists')
          script_path.write_text(script, encoding='utf-8')
          print('PASS: source price is $79.00 and build now rejects future pricing drift')
          PY

      - name: Execute hardened production build validation
        run: |
          node scripts/prepare-corporate-trust.js
          node scripts/apply-search-entity-remediation.cjs
          node scripts/validate-ai-procurement-pillar.cjs
          grep -Fq 'Additional report · $79.00 one-time' index.html
          if grep -Fq 'Additional report · $15 one-time' index.html; then exit 1; fi

      - name: Commit permanent repair and remove this one-time workflow
        run: |
          git config user.name "APROPOS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- index.html scripts/apply-search-entity-remediation.cjs
          git rm -- .github/workflows/repair-analyze-fit-price-source.yml
          git commit -m "fix: make Analyze Fit $79 source authoritative"
          git push origin HEAD:main
